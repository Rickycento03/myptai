# =============================================================================
# nginx-garmin-ai-coach.conf - Reverse proxy + HTTPS per la PWA
# =============================================================================
# Domini ufficiali: myptai.app + www.myptai.app (certificato Let's Encrypt)
# + riccardo-coach.duckdns.org (dominio temporaneo precedente, redirect HTTP).
#
# Certificato (una sola esecuzione):
#   sudo certbot --nginx -d myptai.app -d www.myptai.app \
#       --non-interactive --agree-tos -m admin@example.com
#
# Nota: il Service Worker della PWA richiede un secure context (HTTPS):
# senza HTTPS l'installazione su iPhone/Android non è completa.
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name myptai.app www.myptai.app riccardo-coach.duckdns.org;

    # Upload JSON potenzialmente grandi (piani allenamento, prompt chat)
    client_max_body_size 4m;

    # ================================================================
    # OWASP Security Headers (7-Layer Cybersecurity) — replicati anche
    # nella location statica (nginx non eredita add_header se una location
    # ne definisce uno proprio).
    # ================================================================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), battery=(), interest-cohort=()" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # DeepSeek + sync Garmin possono richiedere fino a 3 minuti
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_connect_timeout 10;
    }

    # Cache asset statici della PWA (gestiti anche dal Service Worker)
    location ~* \.(css|js|png|jpg|svg|webp|ico|woff2?)$ {
        proxy_pass http://127.0.0.1:8000;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), battery=(), interest-cohort=()" always;
    }
}
